services:
  mysql:
    image: mysql:8.0
    container_name: toletmama-mysql
    restart: unless-stopped
    env_file:
      - ./docker.env
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - toletmama-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: toletmama-backend
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_cache:/var/www/html/bootstrap/cache
      - backend_storage:/var/www/html/storage
    env_file:
      - ./docker.env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - toletmama-network

  nginx:
    image: nginx:alpine
    container_name: toletmama-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - backend_vendor:/var/www/html/vendor
      - backend_cache:/var/www/html/bootstrap/cache
      - backend_storage:/var/www/html/storage
    depends_on:
      - backend
    networks:
      - toletmama-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.prod
    container_name: toletmama-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend.nginx.conf:/etc/nginx/conf.d/default.conf
    environment:
      - VITE_API_URL=http://localhost/api
    depends_on:
      - nginx
    networks:
      - toletmama-network

volumes:
  mysql_data:
  backend_vendor:
  backend_cache:
  backend_storage:
  frontend_node_modules:

networks:
  toletmama-network:
    driver: bridge
