services:
  mysql:
    image: mysql:8.0
    container_name: toletmama-mysql
    restart: unless-stopped
    env_file:
      - ./docker.env
    volumes:
      - mysql_data:/var/lib/mysql
    command: --sort-buffer-size=67108864 --read-rnd-buffer-size=67108864 --tmp-table-size=67108864 --max-heap-table-size=67108864
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: toletmama-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_cache:/var/www/html/bootstrap/cache
    env_file:
      - ./docker.env
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: toletmama-frontend
    restart: unless-stopped
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./src:/app/src
      - ./index.html:/app/index.html
      - ./vite.config.js:/app/vite.config.js
      - ./package.json:/app/package.json
      - ./.env:/app/.env
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID:-}
    command: sh -c "npm run dev -- --host 0.0.0.0"

volumes:
  mysql_data:
  backend_vendor:
  backend_cache:
  frontend_node_modules:
